contract_discovery:
  openapi: none
  swagger: none
  graphql: none
  asyncapi: none
  mcp: none
  note: >-
    Round-2 contract discovery went beyond the docs host: /openapi.json,
    /swagger.json and /llms.txt were probed on every resolving FortisBC host
    (www, accounts, outages, rebates), not just www. No host returns a
    parseable OpenAPI/Swagger document; the only 200s are WAF block pages.
    The one undocumented machine-readable endpoint found anywhere on the estate
    is https://outages.fortisbc.com/Outages/Home/GetUpdateStatus, an internal
    AJAX call referenced at line 736 of the outage-map page that returns
    text/xml `<UpdateStatus><Message value="Updated: YYYY-MM-DD HH:MM" /></UpdateStatus>`
    — a single last-refreshed timestamp, undocumented, unversioned, with no
    published contract. It is recorded here as evidence and is deliberately NOT
    catalogued as a FortisBC API. The outage map itself draws a Bing Maps
    control (dev.virtualearth.net); its client script exposes no FortisBC data
    endpoint.
