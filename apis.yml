name: FortisBC
kind: company
description: >-
  FortisBC is a British Columbia energy utility and a subsidiary of Fortis Inc.,
  delivering natural gas to more than 1,054,000 customers and electricity
  directly to close to 185,000 customers across the province's Southern
  Interior, plus liquefied natural gas from the Tilbury and Mt. Hayes
  facilities, renewable natural gas, and EV charging. It sits at the regulated
  distribution tier of the value chain — the wires-and-pipes monopoly that meters
  the customer — under British Columbia Utilities Commission oversight, in a
  province with no wholesale electricity market and no consumer energy data
  right. Its API posture is honestly none: no developer portal, no published
  API, no OpenAPI, and no Green Button. British Columbia sits outside Ontario's
  Green Button regulation (O. Reg. 633/21) and outside Australia's Consumer Data
  Right, and the Green Button Alliance reports only "minor discussions of Green
  Button in British Columbia to-date". Consumer usage data is reachable only by
  the account holder through a SiteMinder-protected customer login at
  accounts.fortisbc.com, or — for commercial gas customers only — pushed into
  the US EPA's ENERGY STAR Portfolio Manager via that platform's data exchange,
  an arrangement FortisBC participates in rather than an API it publishes. No
  open market, grid, or system data is published. Consumer data closed, market
  data closed.
